<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07163d">
  <title>WeCode Play | Misiones digitales</title>
  <style>
    :root{
      --navy:#07163d;--deep:#030b29;--blue:#2d63a7;--bright:#4b8ed8;
      --yellow:#ffca3a;--orange:#ff9f1c;--sky:#71d8f6;--ink:#11224d;
      --paper:#f5f8fc;--muted:#65738b
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--deep);font-family:Nunito,"Arial Rounded MT Bold",Arial,sans-serif}
    body{color:white}
    button{font:inherit;color:inherit}
    button:focus-visible{outline:4px solid var(--sky);outline-offset:4px}
    .app{min-height:100vh;overflow:hidden;position:relative}
    .cosmos{
      background:
        linear-gradient(rgba(48,91,151,.1) 1px,transparent 1px),
        linear-gradient(90deg,rgba(48,91,151,.1) 1px,transparent 1px),
        radial-gradient(circle at 75% 5%,#112c5c 0,transparent 38%),
        linear-gradient(140deg,#071941,#030a28 72%);
      background-size:34px 34px,34px 34px,auto,auto
    }
    .cosmos:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 46%,rgba(0,4,22,.45))}
    .top{max-width:1220px;margin:auto;padding:25px 30px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:3}
    .brand{display:flex;align-items:center;gap:10px}
    .brand img{width:210px;height:54px;object-fit:contain;object-position:left center;display:block}
    .pill,.back{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:10px 15px;font-weight:900}
    .pill{font-size:13px}.pill span,.back span{color:var(--yellow)}
    .back{cursor:pointer}
    .orbit{position:absolute;width:430px;height:900px;border:2px solid rgba(108,150,207,.24);border-radius:50%;pointer-events:none}
    .orbit.a{left:-180px;top:190px;transform:rotate(-26deg)}
    .orbit.b{right:-120px;top:-350px;transform:rotate(39deg)}
    .star{position:absolute;color:var(--sky);font:36px Arial;z-index:1}.s1{left:13%;top:17%}.s2{right:12%;top:22%}
    .hero{max-width:1080px;margin:auto;padding:25px 25px 55px;text-align:center;position:relative;z-index:2}
    .eyebrow{color:var(--yellow);font-size:12px;font-weight:1000;letter-spacing:3px;margin:0 0 15px}
    h1{font-size:clamp(44px,6vw,82px);letter-spacing:-4px;line-height:1;margin:0;font-weight:1000}
    h1 em{color:var(--yellow);font-style:normal}
    .lead{color:#d8e7ff;font-size:17px;font-weight:700;margin:20px 0 32px}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:870px;margin:auto}
    .choice{min-height:330px;background:white;color:var(--ink);border:0;border-radius:25px;box-shadow:0 15px 0 rgba(0,0,0,.2),0 28px 55px rgba(0,0,0,.3);cursor:pointer;overflow:hidden;position:relative;text-align:left;transition:.18s}
    .choice:hover{transform:translateY(5px);box-shadow:0 10px 0 rgba(0,0,0,.2),0 25px 55px rgba(0,0,0,.34)}
    .choice-art{height:160px;background:#e8f1fb;display:flex;align-items:center;justify-content:center;position:relative}
    .mouse-choice .choice-art{background:#fff3d2}
    .mission-tag{position:absolute;left:18px;top:16px;z-index:2;background:var(--blue);color:white;padding:7px 11px;border-radius:99px;font-size:10px;font-weight:1000;letter-spacing:2px}
    .mouse-choice .mission-tag{background:var(--orange);color:var(--navy)}
    .keys{display:grid;grid-template-columns:repeat(3,54px);gap:7px;transform:rotate(-5deg)}
    .keys i{height:44px;background:white;border:2px solid #c5d6ea;border-bottom-width:6px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--blue);font-style:normal;font-weight:1000;box-shadow:0 6px 10px rgba(24,67,113,.12)}
    .mouse-icon{width:70px;height:105px;background:white;border:3px solid var(--orange);border-radius:50% 50% 44% 44%;position:relative;box-shadow:0 8px 20px rgba(122,72,0,.16)}
    .mouse-icon:before{content:"";position:absolute;left:50%;top:0;width:3px;height:42px;background:var(--orange)}
    .mouse-icon:after{content:"↖";position:absolute;color:var(--blue);font-size:38px;left:72px;top:54px;font-weight:1000}
    .choice-copy{padding:19px 25px 12px;display:flex;flex-direction:column}
    .choice-copy small{color:#6a7891;font-size:10px;font-weight:1000;letter-spacing:2px}
    .choice-copy strong{color:var(--blue);font-size:36px;line-height:1.1}.mouse-choice .choice-copy strong{color:#e88900}
    .choice-copy span{color:#57647b;font-size:14px;font-weight:700;margin-top:6px}
    .choice-go{margin:0 25px;border-top:1px solid #dfe7f2;padding:14px 0;display:flex;justify-content:space-between;color:var(--blue);font-size:13px;font-weight:1000}
    .mouse-choice .choice-go{color:#dc8200}
    .library{max-width:940px}
    .library-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px;text-align:left}
    .library-card{min-height:330px;background:white;color:var(--ink);border:0;border-radius:23px;box-shadow:0 13px 0 rgba(0,0,0,.2);cursor:pointer;overflow:hidden;padding:0;position:relative;transition:.17s}
    .library-card:hover{transform:translateY(5px);box-shadow:0 8px 0 rgba(0,0,0,.2)}
    .library-art{height:175px;background:#fff3d2;display:flex;align-items:center;justify-content:center;position:relative}
    .library-card.tangram-card .library-art{background:#eaf1fb}
    .library-copy{padding:19px 23px;display:flex;flex-direction:column}
    .library-copy small{color:#78869b;font-size:10px;font-weight:1000;letter-spacing:2px}
    .library-copy strong{color:var(--blue);font-size:27px;margin:3px 0}
    .library-copy span{color:#5f6d84;font-size:13px;font-weight:700}
    .library-copy b{color:var(--blue);font-size:13px;margin-top:15px}
    .tangram-mark{width:140px;height:120px;position:relative}
    .tangram-mark i{position:absolute;display:block;filter:drop-shadow(0 4px 1px rgba(0,0,0,.12))}
    .tangram-mark .tm1{width:70px;height:70px;background:#ff6b68;clip-path:polygon(50% 0,100% 100%,0 100%);left:5px;top:8px;transform:rotate(-45deg)}
    .tangram-mark .tm2{width:66px;height:66px;background:#5bd5f7;clip-path:polygon(50% 0,100% 100%,0 100%);right:4px;top:14px;transform:rotate(45deg)}
    .tangram-mark .tm3{width:47px;height:47px;background:#ffca3a;left:46px;bottom:5px;transform:rotate(45deg)}
    .tangram-mark .tm4{width:44px;height:39px;background:#8ee36b;clip-path:polygon(22% 0,100% 0,78% 100%,0 100%);right:3px;bottom:1px}
    .ninja-card .library-art{background:#e9f2ff}
    .ninja-mark{width:210px;height:150px;position:relative}
    .ninja-mark .mini-balloon{position:absolute;width:52px;height:64px;border-radius:52% 52% 48% 48%;background:#ff6b68;left:79px;top:3px;box-shadow:inset -8px -6px 0 rgba(0,0,0,.08)}
    .ninja-mark .mini-balloon:before{content:"";position:absolute;left:25px;top:61px;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid #ff6b68;transform:translateX(-50%)}
    .ninja-mark .mini-balloon:after{content:"";position:absolute;left:25px;top:68px;width:2px;height:35px;background:#7f8ca0}
    .ninja-mark .mini-ninja{position:absolute;left:88px;top:76px;font-size:27px;z-index:2;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
    .ninja-mark .mini-word{position:absolute;left:48px;top:105px;width:114px;padding:8px;background:white;border:3px solid var(--yellow);border-radius:10px;text-align:center;color:var(--blue);font-weight:1000;letter-spacing:2px;box-shadow:0 5px 0 #d7e1ed}
    .ninja-mark .spark{position:absolute;color:var(--yellow);font-size:25px;font-weight:1000}.ninja-mark .spark.a{left:25px;top:30px}.ninja-mark .spark.b{right:22px;top:55px}
    .picker{max-width:1050px;margin:auto;padding:10px 28px 70px;text-align:center;position:relative;z-index:2}
    .mission-icon{width:72px;height:72px;border-radius:22px;background:var(--blue);border:6px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:32px;font-weight:1000;transform:rotate(-4deg)}
    .mission-icon.mouse{background:var(--orange);color:var(--navy)}
    .picker h1{font-size:clamp(40px,5vw,64px)}
    .picker .lead{margin:12px 0 28px}
    .difficulties{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;text-align:left}
    .difficulty{min-height:255px;background:white;color:var(--ink);border:0;border-top:7px solid #68d8a5;border-radius:20px;box-shadow:0 13px 0 rgba(0,0,0,.2);padding:22px;cursor:pointer;display:flex;flex-direction:column;transition:.16s}
    .difficulty:nth-child(2){border-color:var(--yellow)}.difficulty:nth-child(3){border-color:#ff746e}
    .difficulty:hover{transform:translateY(5px);box-shadow:0 8px 0 rgba(0,0,0,.2)}
    .difficulty small{color:#a7b3c5;font-weight:1000;letter-spacing:2px}
    .difficulty strong{color:var(--blue);font-size:25px;margin-top:10px}
    .difficulty>span{color:#5e6b81;font-size:13px;font-weight:700}
    .difficulty .rule{background:#eef3f9;color:#45536e;padding:10px;border-radius:10px;margin-top:18px;font-size:12px;font-weight:900}
    .difficulty .choose{margin-top:auto;padding-top:16px;color:var(--blue);font-weight:1000;display:flex;justify-content:space-between}
    .game{background:#f2f6fc;color:var(--ink);min-height:100vh}
    .game-head{height:76px;background:white;border-bottom:1px solid #dbe4ef;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 28px;gap:20px}
    .game-head .back{background:#eef3f8;border-color:#d9e3ee;color:var(--ink);justify-self:start}
    .game-name{display:flex;align-items:center;gap:10px}.game-name .badge{width:39px;height:39px;border-radius:10px;background:var(--blue);color:white;display:flex;align-items:center;justify-content:center}
    .game-name>div{display:flex;flex-direction:column}.game-name strong{font-size:16px}.game-name small{color:#77849a;font-weight:800}
    .stats{display:flex;gap:25px;justify-self:end}.stat{display:flex;flex-direction:column;min-width:65px}.stat small{color:#7c899e;font-size:9px;font-weight:1000;letter-spacing:2px}.stat strong{color:var(--blue);font-size:20px}
    .hearts .off{color:#dce2eb}.hearts span{color:#ff676a}
    .letter-arena{height:calc(100vh - 138px);min-height:510px;max-height:650px;max-width:1180px;margin:18px auto 0;border:6px solid white;border-radius:23px;overflow:hidden;position:relative;background:linear-gradient(rgba(66,105,155,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(66,105,155,.08) 1px,transparent 1px),radial-gradient(circle at 50% 0,#17346a,transparent 55%),linear-gradient(#071944,#040c2a);background-size:35px 35px,35px 35px,auto,auto;box-shadow:0 18px 45px rgba(15,39,83,.22)}
    .typing-arena{height:calc(100vh - 140px);min-height:520px;max-height:660px;max-width:1180px;margin:18px auto 0;border:6px solid white;border-radius:23px;overflow:hidden;position:relative;background:linear-gradient(rgba(85,129,187,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(85,129,187,.08) 1px,transparent 1px),radial-gradient(circle at 20% 10%,#1b4380,transparent 32%),linear-gradient(180deg,#0b2455,#061437);background-size:38px 38px,38px 38px,auto,auto;box-shadow:0 18px 45px rgba(15,39,83,.22)}
    .typing-arena:before,.typing-arena:after{content:"";position:absolute;width:120px;height:42px;border-radius:50%;background:rgba(255,255,255,.09)}
    .typing-arena:before{left:8%;top:19%}.typing-arena:after{right:9%;top:38%;width:160px}
    .typing-guide{position:absolute;left:18px;top:16px;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 13px;color:#dceaff;font-size:11px;font-weight:900;letter-spacing:1px;z-index:5}
    .danger-line{position:absolute;left:4%;right:4%;bottom:34px;height:3px;border-top:3px dashed rgba(255,108,105,.8);z-index:2}.danger-line span{position:absolute;right:0;bottom:8px;color:#ff9995;font-size:10px;font-weight:1000;letter-spacing:2px}
    .word-balloon{position:absolute;width:170px;height:180px;transform:translateX(-50%);z-index:3;will-change:top}
    .balloon-shape{position:absolute;left:50%;top:0;width:72px;height:84px;transform:translateX(-50%);border-radius:52% 52% 48% 48%;background:var(--balloon);border:3px solid rgba(255,255,255,.7);box-shadow:inset -10px -8px 0 rgba(0,0,0,.09),0 8px 18px rgba(0,0,0,.18)}
    .balloon-shape:before{content:"";position:absolute;left:18px;top:13px;width:15px;height:24px;border-radius:50%;background:rgba(255,255,255,.35);transform:rotate(25deg)}
    .balloon-shape:after{content:"";position:absolute;left:34px;top:82px;width:2px;height:43px;background:#bac8dc}
    .balloon-knot{position:absolute;left:50%;top:78px;width:12px;height:11px;background:var(--balloon);clip-path:polygon(50% 0,100% 100%,0 100%);transform:translateX(-50%)}
    .word-ninja{position:absolute;left:50%;top:102px;transform:translateX(-50%);font-size:29px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2));z-index:2}
    .word-tag{position:absolute;left:50%;top:130px;min-width:128px;transform:translateX(-50%);padding:10px 13px;background:white;border:3px solid #a9bbd2;border-radius:11px;color:#65748b;text-align:center;font-size:18px;font-weight:1000;letter-spacing:2px;box-shadow:0 6px 0 rgba(0,0,0,.18);white-space:nowrap}
    .word-balloon.active{z-index:5}.word-balloon.active .word-tag{border-color:var(--yellow);color:var(--ink);box-shadow:0 6px 0 #d58900,0 0 18px rgba(255,202,58,.5)}.word-balloon.active .word-ninja{animation:ninjaReady .75s infinite alternate}
    .word-tag .typed{color:#2ab276}.word-tag .cursor-letter{background:var(--yellow);color:var(--navy);border-radius:4px;padding:0 2px}
    .word-balloon.wrong .word-tag{animation:wordShake .24s}.word-balloon.rescued .balloon-shape{animation:balloonPop .4s forwards}.word-balloon.rescued .word-tag{animation:tagSaved .4s forwards}.word-balloon.rescued .word-ninja{animation:ninjaLeap .52s ease-in forwards}
    .typing-flash{position:absolute;left:50%;top:24%;z-index:7;transform:translateX(-50%);padding:11px 18px;background:#29b979;border:4px solid white;border-radius:999px;color:white;font-size:17px;font-weight:1000;box-shadow:0 10px 25px rgba(0,0,0,.28);pointer-events:none;animation:toastUp 1.05s ease forwards}
    @keyframes ninjaReady{to{transform:translateX(-50%) translateY(-4px) rotate(-3deg)}}
    @keyframes wordShake{25%{transform:translateX(calc(-50% - 7px))}75%{transform:translateX(calc(-50% + 7px))}}
    @keyframes balloonPop{60%{transform:translateX(-50%) scale(1.18)}100%{transform:translateX(-50%) scale(0);opacity:0}}
    @keyframes tagSaved{to{opacity:0;transform:translateX(-50%) translateY(25px) scale(.8)}}
    @keyframes ninjaLeap{0%{transform:translateX(-50%) rotate(0)}45%{transform:translate(calc(-50% + var(--jump-mid-x,55px)),var(--jump-mid-y,-75px)) rotate(18deg) scale(1.25)}100%{transform:translate(calc(-50% + var(--jump-x,105px)),var(--jump-y,-20px)) rotate(35deg);opacity:0}}
    .falling{position:absolute;width:64px;height:64px;border:4px solid rgba(255,255,255,.85);border-radius:16px;box-shadow:0 7px 0 rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;color:var(--navy);font-size:34px;font-weight:1000;z-index:3}
    .c0{background:var(--yellow)}.c1{background:var(--sky)}.c2{background:#ff7a77}.c3{background:#9ce075}
    .arena-toast{position:absolute;left:50%;top:18%;z-index:7;transform:translateX(-50%);padding:12px 19px;border:4px solid white;border-radius:999px;color:white;font-size:18px;font-weight:1000;box-shadow:0 10px 25px rgba(0,0,0,.28);pointer-events:none;animation:toastUp 1.15s ease forwards}
    .arena-toast.life{background:#29b979}.arena-toast.wrong{background:#ef5b61}
    @keyframes toastUp{0%{opacity:0;transform:translate(-50%,20px) scale(.75)}20%{opacity:1;transform:translate(-50%,0) scale(1.08)}72%{opacity:1;transform:translate(-50%,-8px) scale(1)}100%{opacity:0;transform:translate(-50%,-35px) scale(.9)}}
    .robot{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);width:90px;height:95px;z-index:4}
    .robot .head{position:absolute;left:17px;top:7px;width:56px;height:43px;background:#e9f4ff;border:4px solid #4f83bd;border-radius:17px;display:flex;align-items:center;justify-content:center;color:#1c4d82;font-weight:1000}
    .robot .body{position:absolute;left:10px;top:47px;width:70px;height:47px;background:var(--blue);border:4px solid #79aeeb;border-radius:12px 12px 19px 19px;color:white;display:flex;align-items:center;justify-content:center;font-weight:1000}
    .robot .antenna{position:absolute;left:39px;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--yellow);border:3px solid #4f83bd}
    .beam{position:absolute;left:44px;bottom:85px;width:3px;height:0;background:linear-gradient(transparent,var(--sky));opacity:0}.robot.fire .beam{height:240px;opacity:1}
    .ground{position:absolute;bottom:20px;left:8%;right:8%;height:3px;background:linear-gradient(90deg,transparent,#3975b7,transparent)}
    .overlay{position:absolute;inset:0;background:rgba(4,12,42,.63);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
    .modal{width:min(480px,100%);background:white;color:var(--ink);border-radius:24px;padding:30px 34px;text-align:center;box-shadow:0 18px 0 rgba(0,0,0,.18)}
    .modal .kicker{color:var(--blue);font-size:11px;font-weight:1000;letter-spacing:2px}.modal h2{color:var(--blue);font-size:36px;margin:6px 0 10px}.modal p{color:#56647b;font-size:15px;font-weight:700;line-height:1.5;margin:0 0 20px}
    .steps{background:#eef4fa;border-radius:14px;padding:12px;margin-bottom:20px;color:#63728c;font-size:12px;font-weight:900}.steps b{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;background:var(--yellow);color:var(--navy);border-radius:6px}
    .primary{background:linear-gradient(135deg,var(--orange),var(--yellow));border:0;border-radius:13px;box-shadow:0 6px 0 #d98200;color:var(--navy);cursor:pointer;padding:14px 24px;font-weight:1000}
    .secondary{display:block;margin:16px auto 0;background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;font-weight:900}
    .result-icon{font-size:44px;display:block;margin-bottom:5px}
    .tutorial-modal{max-width:680px;padding:30px 34px 28px;position:relative}
    .tutorial-close{position:absolute;right:17px;top:15px;width:42px;height:42px;border:0;border-radius:50%;background:#edf3fa;color:var(--blue);font-size:29px;line-height:1;cursor:pointer;font-weight:900;transition:.15s}
    .tutorial-close:hover{background:var(--yellow);color:var(--navy);transform:rotate(6deg)}
    .tutorial-modal h2{font-size:32px;padding:0 45px}
    .demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
    .demo-panel{height:255px;background:#f1f6fb;border:2px solid #dfe8f3;border-radius:18px;position:relative;overflow:hidden}
    .demo-panel.touch-demo{background:#fff7df;border-color:#f3dfaa}
    .demo-kind{position:absolute;left:14px;top:12px;width:42px;height:42px;border-radius:12px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:23px}
    .touch-demo .demo-kind{background:var(--orange)}
    .demo-stage{position:absolute;left:18px;right:18px;top:61px;height:78px;border-bottom:3px dotted #c6d2e1}
    .demo-piece{position:absolute;left:6px;top:10px;width:52px;height:52px;border-radius:50%;background:#ffca3a;border:3px solid white;box-shadow:0 5px 0 rgba(0,0,0,.15);z-index:2;animation:demoDrag 3.2s ease-in-out infinite}
    .touch-demo .demo-piece{background:#ff6b68;border-radius:8px;clip-path:polygon(50% 0,100% 100%,0 100%)}
    .demo-hole{position:absolute;right:6px;top:5px;width:62px;height:62px;border-radius:50%;background:#9eabbc;border:3px dashed #6e7d91;opacity:.72}
    .touch-demo .demo-hole{border-radius:8px;clip-path:polygon(50% 0,100% 100%,0 100%)}
    .mouse-device{position:absolute;left:calc(50% - 35px);bottom:18px;width:70px;height:78px;background:white;border:3px solid var(--blue);border-radius:50% 50% 44% 44%;box-shadow:0 7px 14px rgba(45,99,167,.15);animation:deviceMove 3.2s ease-in-out infinite}
    .mouse-device:before{content:"";position:absolute;left:50%;top:0;width:2px;height:30px;background:var(--blue)}
    .mouse-left{position:absolute;left:8px;top:8px;width:24px;height:25px;border-radius:12px 4px 7px 5px;background:#dfeaf6;animation:clickHold 3.2s ease-in-out infinite}
    .pad-device{position:absolute;left:calc(50% - 82px);bottom:15px;width:164px;height:88px;border:3px solid #d89319;border-radius:13px;background:#fffdf6;box-shadow:0 7px 14px rgba(160,101,0,.12)}
    .pad-button{position:absolute;left:0;right:0;bottom:0;height:25px;border-top:2px solid #e2b45c;background:#fff1c8}
    .finger{position:absolute;width:24px;height:34px;border-radius:14px 14px 9px 9px;background:#ffb18c;border:2px solid white;box-shadow:0 3px 8px rgba(102,54,25,.2);z-index:3}

      function spawnLetter(){
        const alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ",el=document.createElement("div"),item={id:nextId++,char:alphabet[Math.floor(Math.random()*26)],x:8+Math.random()*84,y:-70,speed:cfg.speed+Math.floor(score/50)*cfg.ramp,el};
        el.className="falling c"+Math.floor(Math.random()*4);el.textContent=item.char;el.style.left=item.x+"%";arena.appendChild(el);letters.push(item)
      }
      function loop(now){
        if(!playing)return;
        const dt=Math.min((now-last)/1000,.05);last=now;spawn+=dt*1000;
        if(spawn>=cfg.spawn&&letters.length<8){spawn=0;spawnLetter()}
        const bottom=arena.clientHeight-105;
        letters.slice().forEach(item=>{
          item.y+=item.speed*dt;item.el.style.top=item.y+"px";
          if(item.y>bottom){item.el.remove();letters=letters.filter(x=>x!==item);lives--;updateHearts();if(lives<=0)finish()}
        });
        raf=requestAnimationFrame(loop)
      }
      function keydown(e){
        if(!playing||e.repeat)return;const key=e.key.toUpperCase();if(!/^[A-Z]$/.test(key))return;
        robot.classList.add("fire");robotKey.textContent=key;setTimeout(()=>robot.classList.remove("fire"),130);
        const matches=letters.filter(x=>x.char===key).sort((a,b)=>b.y-a.y);
        if(matches.length){
          const hit=matches[0],previousScore=score;
          hit.el.remove();letters=letters.filter(x=>x!==hit);score+=10;scoreEl.textContent=String(score).padStart(3,"0");
          if(Math.floor(score/500)>Math.floor(previousScore/500)){lives++;updateHearts();showArenaToast("♥ +1 VIDA","life")}
        }else if(difficulty==="hard"){
          lives--;updateHearts();showArenaToast("−1 VIDA","wrong");if(lives<=0)finish()
        }
      }
      function start(){letters.forEach(x=>x.el.remove());letters=[];score=0;lives=3;scoreEl.textContent="000";updateHearts();arena.querySelector(".overlay")?.remove();playing=true;last=performance.now();spawn=cfg.spawn-400;window.addEventListener("keydown",keydown);raf=requestAnimationFrame(loop)}
      function finish(){playing=false;cancelAnimationFrame(raf);window.removeEventListener("keydown",keydown);arena.insertAdjacentHTML("beforeend",'<div class="overlay"><div class="modal"><span class="result-icon">🚀</span><span class="kicker">FIN DE LA MISIÓN</span><h2>¡Gran intento!</h2><p>Conseguiste '+score+' puntos. Cada intento entrena tus dedos.</p><button class="primary" id="retryKeyboard">Jugar otra vez</button><button class="secondary" onclick="go(\'picker\',\'keyboard\')">Cambiar dificultad</button></div></div>');document.getElementById("retryKeyboard").onclick=start}
      document.getElementById("startKeyboard").onclick=start;
      cleanup=()=>{playing=false;cancelAnimationFrame(raf);window.removeEventListener("keydown",keydown)}
    }
    function typingGame(difficulty){
      let balloons=[],score=0,saved=0,typed="",playing=false,jumping=false,raf=0,last=0,nextId=1,lastWord="",timeouts=[];
      const cfg={easy:{speed:24,label:"Lento"},medium:{speed:34,label:"Medio"},hard:{speed:45,label:"Rápido"}}[difficulty];
      const words=["SOL","LUNA","CASA","GATO","PERRO","NUBE","FLOR","AGUA","ROJO","AZUL","VERDE","MANO","MESA","LIBRO","JUEGO","NINJA","GLOBO","AMIGO","SALTO","TECLA","RATON","PLANETA","COHETE","ESTRELLA"];
      const colors=["#ff6b68","#5bd5f7","#ffca3a","#8ee36b","#ae8bff","#ff9357"];
      const stats='<div class="stat"><small>PUNTOS</small><strong id="typingScore">000</strong></div><div class="stat"><small>SALVADOS</small><strong id="savedWords">0</strong></div>';
      app.innerHTML='<main class="app game">'+gameHeader("typing",difficulty,stats)+'<section class="typing-arena" id="typingArena"><div class="typing-guide">VELOCIDAD: '+cfg.label.toUpperCase()+'</div><div class="danger-line"><span>LÍNEA DE PELIGRO</span></div><div class="overlay" id="typingOverlay"><div class="modal"><span class="result-icon">🥷🎈</span><span class="kicker">TU MISIÓN</span><h2>¡Saltá con palabras!</h2><p>Escribí la palabra amarilla completa. El ninja saltará al siguiente globo.</p><div class="steps"><b>S</b><b>O</b><b>L</b> &nbsp;→&nbsp; 🥷✨</div><button class="primary" id="startTyping">¡Empezar misión!</button></div></div></section><p class="tip">💡 Escribí una letra detrás de otra. La palabra amarilla es la que toca.</p></main>';
      const arena=document.getElementById("typingArena"),scoreEl=document.getElementById("typingScore"),savedEl=document.getElementById("savedWords");
      function delay(fn,ms){const id=setTimeout(fn,ms);timeouts.push(id);return id}
      function chooseWord(){
        let word=words[Math.floor(Math.random()*words.length)];
        while(word===lastWord)word=words[Math.floor(Math.random()*words.length)];
        lastWord=word;return word
      }
      function makeBalloon(y,x){
        const el=document.createElement("div"),item={id:nextId++,word:chooseWord(),x,y,el,color:colors[(nextId+saved)%colors.length]};
        el.className="word-balloon";el.style.left=x+"%";el.style.top=y+"px";el.style.setProperty("--balloon",item.color);
        el.innerHTML='<i class="balloon-shape"></i><i class="balloon-knot"></i><span class="word-ninja">🥷</span><span class="word-tag"></span>';
        arena.appendChild(el);balloons.push(item);return item
      }
      function renderWord(){
        balloons.forEach((item,index)=>{
          item.el.classList.toggle("active",index===0);
          const tag=item.el.querySelector(".word-tag");
          if(index!==0){tag.textContent=item.word;return}
          const done=item.word.slice(0,typed.length),current=item.word.charAt(typed.length),rest=item.word.slice(typed.length+1);
          tag.innerHTML='<span class="typed">'+done+'</span>'+(current?'<span class="cursor-letter">'+current+'</span>':"")+rest
        })
      }
      function resetBalloons(){
        balloons.forEach(item=>item.el.remove());balloons=[];typed="";nextId=1;lastWord="";
        makeBalloon(80,28);makeBalloon(5,58);makeBalloon(-70,78);renderWord()
      }
      function showFlash(text){
        const flash=document.createElement("div");flash.className="typing-flash";flash.textContent=text;arena.appendChild(flash);delay(()=>flash.remove(),1100)
      }
      function loop(now){
        if(!playing)return;
        const dt=Math.min((now-last)/1000,.05);last=now;
        balloons.forEach(item=>{item.y+=(cfg.speed+saved*.45)*dt;item.el.style.top=item.y+"px"});
        if(!jumping&&balloons[0]&&balloons[0].y>arena.clientHeight-205){finish()}
        if(playing)raf=requestAnimationFrame(loop)
      }
      function keydown(e){
        if(!playing||jumping||e.repeat||!balloons[0])return;
        if(e.key==="Backspace"){e.preventDefault();typed=typed.slice(0,-1);renderWord();return}
        const key=e.key.toLocaleUpperCase("es");
        if(!/^[A-ZÁÉÍÓÚÜÑ]$/.test(key))return;
        const active=balloons[0],expected=active.word.charAt(typed.length);
        if(key===expected){
          typed+=key;renderWord();
          if(typed===active.word)rescue()
        }else{
          active.el.classList.remove("wrong");void active.el.offsetWidth;active.el.classList.add("wrong");delay(()=>active.el.classList.remove("wrong"),260)
        }
      }
      function rescue(){
        jumping=true;
        const active=balloons[0],next=balloons[1],dx=next?(next.x-active.x)/100*arena.clientWidth:90,dy=next?next.y-active.y-10:-45;
        active.el.style.setProperty("--jump-x",dx+"px");active.el.style.setProperty("--jump-y",dy+"px");active.el.style.setProperty("--jump-mid-x",dx*.5+"px");active.el.style.setProperty("--jump-mid-y",(Math.min(dy,-25)-70)+"px");
        active.el.classList.add("rescued");score+=active.word.length*10;saved++;scoreEl.textContent=String(score).padStart(3,"0");savedEl.textContent=saved;showFlash("¡PALABRA COMPLETA! +"+active.word.length*10);
        delay(()=>{
          active.el.remove();balloons.shift();typed="";
          const highest=Math.min(...balloons.map(item=>item.y)),spots=[24,50,76],newX=spots[(saved+2)%spots.length];
          makeBalloon(highest-78,newX);jumping=false;renderWord()
        },540)
      }
      function start(){
        timeouts.forEach(clearTimeout);timeouts=[];cancelAnimationFrame(raf);window.removeEventListener("keydown",keydown);
        score=0;saved=0;scoreEl.textContent="000";savedEl.textContent="0";document.getElementById("typingOverlay")?.remove();arena.querySelectorAll(".overlay").forEach(el=>el.remove());
        resetBalloons();playing=true;jumping=false;last=performance.now();window.addEventListener("keydown",keydown);raf=requestAnimationFrame(loop)
      }
      function finish(){
        if(!playing)return;playing=false;jumping=false;cancelAnimationFrame(raf);window.removeEventListener("keydown",keydown);
        arena.insertAdjacentHTML("beforeend",'<div class="overlay"><div class="modal"><span class="result-icon">🥷</span><span class="kicker">FIN DE LA MISIÓN</span><h2>¡Buen entrenamiento!</h2><p>Salvaste '+saved+' palabras y conseguiste '+score+' puntos.</p><button class="primary" id="retryTyping">Jugar otra vez</button><button class="secondary" onclick="go(\'picker\',\'typing\')">Cambiar dificultad</button></div></div>');
        document.getElementById("retryTyping").onclick=start
      }
      document.getElementById("startTyping").onclick=start;
      cleanup=()=>{playing=false;cancelAnimationFrame(raf);window.removeEventListener("keydown",keydown);timeouts.forEach(clearTimeout)}
    }
    function mouseGame(difficulty){
      let level=1,placed=[],time=30,timer=0,status="playing",showIntro=true;
      const timed=difficulty!=="easy";
      function render(){
        clearInterval(timer);status="playing";const shapes=shapeData.slice(0,Math.min(2+level,shapeData.length));
        const stats='<div class="stat"><small>NIVEL</small><strong>'+String(level).padStart(2,"0")+'</strong></div>'+(timed?'<div class="stat"><small>TIEMPO</small><strong id="time">'+time+'s</strong></div>':'<div class="stat"><small>RITMO</small><strong>∞</strong></div>');
        const targets=shapes.map(s=>'<div class="cell target" data-shape="'+s.id+'" aria-label="Hueco de '+s.label+'"><div class="shape silhouette '+s.id+'"></div></div>').join("");
        const pieces=shapes.map(s=>'<div class="cell piece" data-piece="'+s.id+'"><div class="shape '+s.id+'" draggable="true" data-drag="'+s.id+'" style="--color:'+s.color+'" aria-label="Arrastrar '+s.label+'"></div></div>').join("");
        app.innerHTML='<main class="app game">'+gameHeader("mouse",difficulty,stats)+'<section class="shape-game"><div class="progress"><i id="progress"></i></div><div class="board targets"><div class="board-title"><b>1</b><div><strong>Buscá el hueco</strong><small id="count">0 de '+shapes.length+' encajadas</small></div></div><div class="shape-grid">'+targets+'</div></div><div class="board-arrow">←</div><div class="board pieces"><div class="board-title"><b>2</b><div><strong>Arrastrá la forma</strong><small>Mantené apretado el mouse</small></div></div><div class="shape-grid">'+pieces+'</div></div></section><p class="tip">🖱️ Hacé clic, mantené apretado y soltá sobre el hueco correcto.</p></main>';

        });

      }
      function startTimer(){
        if(!timed)return;
        timer=setInterval(()=>{if(status!=="playing")return;time--;const el=document.getElementById("time");if(el){el.textContent=time+"s";if(time<=8)el.classList.add("danger")}if(time<=0)lose()},1000)
      }
      function showMouseTutorial(){
        const area=document.querySelector(".shape-game");
        area.insertAdjacentHTML("beforeend",'<div class="overlay" id="mouseTutorial" role="dialog" aria-modal="true" aria-labelledby="tutorialTitle"><div class="modal tutorial-modal"><button class="tutorial-close" id="closeTutorial" aria-label="Cerrar demostración y comenzar el juego">×</button><span class="kicker">ANTES DE EMPEZAR</span><h2 id="tutorialTitle">¡Mirá cómo se hace!</h2><div class="demo-grid"><div class="demo-panel" aria-label="Animación de arrastre con mouse"><span class="demo-kind">🖱️</span><div class="demo-stage"><span class="demo-piece"></span><span class="demo-hole"></span></div><div class="mouse-device"><i class="mouse-left"></i></div></div><div class="demo-panel touch-demo" aria-label="Animación de arrastre con touchpad usando dos dedos"><span class="demo-kind">✋</span><div class="demo-stage"><span class="demo-piece"></span><span class="demo-hole"></span></div><div class="pad-device"><span class="pad-button"></span><i class="finger hold"></i><i class="finger slide"></i></div></div></div></div></div>');
        const close=document.getElementById("closeTutorial");
        close.focus();
        close.onclick=()=>{document.getElementById("mouseTutorial").remove();showIntro=false;startTimer()}
      }
      function place(id,target,shapes){
        document.querySelectorAll(".target").forEach(x=>x.classList.remove("match"));if(id!==target||placed.includes(id)||status!=="playing")return;
        placed.push(id);const shape=shapeData.find(s=>s.id===id),targetEl=document.querySelector('[data-shape="'+id+'"]'),piece=document.querySelector('[data-piece="'+id+'"]');
        targetEl.classList.add("done");targetEl.innerHTML='<div class="shape '+id+'" style="--color:'+shape.color+'"></div><span class="check">✓</span>';piece.classList.add("done");piece.innerHTML="<b style='color:#45ad7d'>¡Listo!</b>";
        document.getElementById("count").textContent=placed.length+" de "+shapes.length+" encajadas";document.getElementById("progress").style.width=(placed.length/shapes.length*100)+"%";

      }

        document.getElementById("nextLevel").onclick=()=>{level++;placed=[];time=difficulty==="hard"?Math.min(30,time+10):30;render()}

        area.insertAdjacentHTML("beforeend",'<div class="overlay"><div class="modal"><span class="result-icon">⏱️</span><span class="kicker">SE TERMINÓ EL TIEMPO</span><h2>¡Casi lo lográs!</h2><p>Llegaste al nivel '+level+'. Probá otra vez con mucha precisión.</p><button class="primary" id="retryMouse">Volver a intentar</button><button class="secondary" onclick="go(\'picker\',\'mouse\')">Cambiar dificultad</button></div></div>');
        document.getElementById("retryMouse").onclick=()=>{level=1;placed=[];time=30;render()}

    function tangramGame(difficulty){
      let level=1,placed=[],filledSlots=[],time=30,timer=0,status="playing",showIntro=true;
      const timed=difficulty!=="easy";
      function pieceSignature(piece){return [piece.type,piece.w,piece.h,((piece.rot%360)+360)%360].join("|")}
      function clearTangramHighlights(){document.querySelectorAll(".t-drop").forEach(drop=>drop.classList.remove("match"));document.querySelectorAll(".t-piece").forEach(piece=>piece.classList.remove("is-selected"))}
      function highlightMatchingSlots(pieceId,puzzle){
        clearTangramHighlights();
        const dragged=puzzle.pieces.find(item=>item.id===pieceId),draggedElement=document.querySelector('[data-t-drag="'+pieceId+'"]');
        if(!dragged)return;
        if(draggedElement)draggedElement.classList.add("is-selected");
        document.querySelectorAll("[data-t-slot]").forEach(drop=>{const target=puzzle.pieces.find(item=>item.id===drop.dataset.tSlot);if(target&&pieceSignature(dragged)===pieceSignature(target)&&!filledSlots.includes(target.id))drop.classList.add("match")})
      }
      function render(){
        clearInterval(timer);status="playing";
        const puzzle=tangramPuzzles[Math.min(level-1,tangramPuzzles.length-1)];
        const stats='<div class="stat"><small>NIVEL</small><strong>'+String(level).padStart(2,"0")+'</strong></div>'+(timed?'<div class="stat"><small>TIEMPO</small><strong id="tangramTime">'+time+'s</strong></div>':'<div class="stat"><small>RITMO</small><strong>∞</strong></div>');
        const slots=puzzle.pieces.map(piece=>'<div class="t-drop" data-t-slot="'+piece.id+'" aria-label="Lugar de la pieza" style="left:'+piece.x+'%;top:'+piece.y+'%;width:'+piece.w+'%;height:'+piece.h+'%"><div class="t-slot t-'+piece.type+'" style="transform:rotate('+piece.rot+'deg);--piece-rotation:rotate('+piece.rot+'deg)"></div></div>').join("");
        const pieces=puzzle.pieces.map(piece=>{
          const scale=88/Math.max(piece.w,piece.h),trayW=Math.max(10,Math.round(piece.w*scale)),trayH=Math.max(10,Math.round(piece.h*scale));
          return '<div class="t-piece-cell" data-t-cell="'+piece.id+'"><div draggable="true" class="t-piece t-'+piece.type+'" data-t-drag="'+piece.id+'" aria-label="Arrastrar pieza de tangram" style="--color:'+piece.color+';width:'+trayW+'px;height:'+trayH+'px;transform:rotate('+piece.rot+'deg)"></div></div>'
        }).join("");
        app.innerHTML='<main class="app game">'+gameHeader("tangram",difficulty,stats)+'<section class="tangram-game"><div class="progress"><i id="tangramProgress"></i></div><div class="board targets"><div class="board-title"><b>1</b><div><strong>Construí la figura</strong><small class="puzzle-name">'+puzzle.icon+' '+puzzle.name+' · <span id="tangramCount">0 de '+puzzle.pieces.length+'</span></small></div></div><div class="tangram-canvas">'+slots+'</div></div><div class="board-arrow">←</div><div class="board pieces"><div class="board-title"><b>2</b><div><strong>Uní las piezas</strong><small>Arrastrá cada color hasta la silueta</small></div></div><div class="tangram-tray">'+pieces+'</div></div></section><p class="tip">▲ Las piezas encastran solas cuando llegan a su lugar correcto.</p></main>';
        document.querySelectorAll("[data-t-drag]").forEach(piece=>{
          piece.addEventListener("pointerdown",()=>highlightMatchingSlots(piece.dataset.tDrag,puzzle));
          piece.addEventListener("dragstart",event=>{highlightMatchingSlots(piece.dataset.tDrag,puzzle);event.dataTransfer.setData("text/plain",piece.dataset.tDrag);event.dataTransfer.effectAllowed="move";event.dataTransfer.setDragImage(piece,piece.offsetWidth/2,piece.offsetHeight/2)});
          piece.addEventListener("dragend",clearTangramHighlights)
        });
        document.querySelectorAll("[data-t-slot]").forEach(slot=>{
          slot.addEventListener("dragover",event=>event.preventDefault());
          slot.addEventListener("drop",event=>{event.preventDefault();placePiece(event.dataTransfer.getData("text/plain"),slot.dataset.tSlot,puzzle)})
        });
        if(showIntro)showTangramTutorial();else startTimer()
      }
      function startTimer(){
        if(!timed)return;
        timer=setInterval(()=>{if(status!=="playing")return;time--;const el=document.getElementById("tangramTime");if(el){el.textContent=time+"s";if(time<=8)el.classList.add("danger")}if(time<=0)lose()},1000)
      }
      function showTangramTutorial(){
        const area=document.querySelector(".tangram-game");
        area.insertAdjacentHTML("beforeend",'<div class="overlay" id="tangramTutorial" role="dialog" aria-modal="true" aria-labelledby="tangramTutorialTitle"><div class="modal tutorial-modal"><button class="tutorial-close" id="closeTangramTutorial" aria-label="Cerrar demostración y comenzar el juego">×</button><span class="kicker">ANTES DE EMPEZAR</span><h2 id="tangramTutorialTitle">¡Mirá cómo se hace!</h2><div class="demo-grid"><div class="demo-panel" aria-label="Animación de arrastre con mouse"><span class="demo-kind">🖱️</span><div class="demo-stage"><span class="demo-piece"></span><span class="demo-hole"></span></div><div class="mouse-device"><i class="mouse-left"></i></div></div><div class="demo-panel touch-demo" aria-label="Animación de arrastre con touchpad usando dos dedos"><span class="demo-kind">✋</span><div class="demo-stage"><span class="demo-piece"></span><span class="demo-hole"></span></div><div class="pad-device"><span class="pad-button"></span><i class="finger hold"></i><i class="finger slide"></i></div></div></div></div></div>');
        const close=document.getElementById("closeTangramTutorial");
        close.focus();
        close.onclick=()=>{document.getElementById("tangramTutorial").remove();showIntro=false;startTimer()}
      }
      function placePiece(id,target,puzzle){
        clearTangramHighlights();
        const piece=puzzle.pieces.find(item=>item.id===id),targetPiece=puzzle.pieces.find(item=>item.id===target);
        if(!piece||!targetPiece||pieceSignature(piece)!==pieceSignature(targetPiece)||placed.includes(id)||filledSlots.includes(target)||status!=="playing")return;
        const drop=document.querySelector('[data-t-slot="'+target+'"]'),slot=drop.querySelector(".t-slot"),cell=document.querySelector('[data-t-cell="'+id+'"]');
        placed.push(id);filledSlots.push(target);slot.classList.add("filled");slot.style.setProperty("--color",piece.color);cell.classList.add("done");cell.innerHTML='<span class="check" style="position:static">✓</span>';
        document.getElementById("tangramCount").textContent=placed.length+" de "+puzzle.pieces.length;document.getElementById("tangramProgress").style.width=(placed.length/puzzle.pieces.length*100)+"%";
        if(placed.length===puzzle.pieces.length)complete(puzzle)
      }
      function complete(puzzle){
        status="complete";clearInterval(timer);const area=document.querySelector(".tangram-game"),final=level===tangramPuzzles.length;
        area.insertAdjacentHTML("beforeend",'<div class="overlay"><div class="modal"><span class="result-icon">'+(final?"🏆":puzzle.icon)+'</span><span class="kicker">'+(final?"SERIE COMPLETA":"NIVEL "+level+" COMPLETO")+'</span><h2>'+(final?"¡Sos experto en tangram!":"¡Figura construida!")+'</h2><p>'+(final?"Completaste todas las figuras.":difficulty==="hard"?"Te quedan "+time+"s. En el próximo nivel sumás 10 segundos.":"La próxima silueta tendrá más piezas.")+'</p><button class="primary" id="nextTangram">'+(final?"Jugar desde el inicio":"Siguiente figura")+'</button></div></div>');
        document.getElementById("nextTangram").onclick=()=>{if(final){level=1;time=30}else{level++;time=difficulty==="hard"?Math.min(30,time+10):30}placed=[];filledSlots=[];render()}
      }
      function lose(){
        status="over";clearInterval(timer);const area=document.querySelector(".tangram-game");
        area.insertAdjacentHTML("beforeend",'<div class="overlay"><div class="modal"><span class="result-icon">⏱️</span><span class="kicker">SE TERMINÓ EL TIEMPO</span><h2>¡Casi lo lográs!</h2><p>Llegaste a la figura '+level+'. Probá otra vez.</p><button class="primary" id="retryTangram">Volver a intentar</button><button class="secondary" onclick="go(\'picker\',\'tangram\')">Cambiar dificultad</button></div></div>');
        document.getElementById("retryTangram").onclick=()=>{level=1;placed=[];filledSlots=[];time=30;render()}
      }
      render();cleanup=()=>clearInterval(timer)
    }
    home();
  </script>
